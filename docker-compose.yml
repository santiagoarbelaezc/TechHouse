services:
  # -----------------------------------------------
  # Databases (Database-per-service pattern)
  # -----------------------------------------------
  db-users:
    image: mysql:8.0
    container_name: techhouse-db-users
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: techhouse_users
    ports:
      - "33061:3306"
    volumes:
      - db_users_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  db-products:
    image: mysql:8.0
    container_name: techhouse-db-products
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: techhouse_products
    ports:
      - "33062:3306"
    volumes:
      - db_products_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  db-payments:
    image: mysql:8.0
    container_name: techhouse-db-payments
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: techhouse_payments
    ports:
      - "33063:3306"
    volumes:
      - db_payments_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  db-assistant:
    image: mysql:8.0
    container_name: techhouse-db-assistant
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: techhouse_assistant
    ports:
      - "33064:3306"
    volumes:
      - db_assistant_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  db_users_data:
  db_products_data:
  db_payments_data:
  db_assistant_data:

